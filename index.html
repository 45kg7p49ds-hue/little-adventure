utton data-id="joshua" class="selected"><span>🧒</span>Joshua</button><button data-id="sophia"><span>👧</span>Sophia</button><button data-id="jayden"><span>🧑</span>Jayden</button><button data-id="rosie"><span>🐕</span>Rosie</button></div><button id="start">Let's play!</button></div></div>
<script>

</script><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/+esm';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xaee6ff);scene.fog=new THREE.Fog(0xaee6ff,22,75);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,150);camera.position.set(0,5,10);camera.lookAt(0,1,-9);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.getElementById('game').append(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x75965b,2.2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(-8,16,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.9});const green=mat(0x7acb71),dark=mat(0x39884c),brown=mat(0x996342),stone=mat(0x858e99),yellow=mat(0xffd05b),blue=mat(0x488ee6),skin=mat(0xffc58f);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),green);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
function mesh(geo,m,x,y,z,parent=scene){const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o}
const box=(w,h,d,m,x,y,z,p)=>mesh(new THREE.BoxGeometry(w,h,d),m,x,y,z,p);
const ball=(r,m,x,y,z,p)=>mesh(new THREE.SphereGeometry(r,12,9),m,x,y,z,p);

const runner=new THREE.Group();scene.add(runner);
// Original gentle chiptune, synthesized locally; audio starts only after player interaction.
let audio=null,master=null,soundOn=true,musicStep=0,nextNote=0;
function initAudio(){try{if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=.32;master.connect(audio.destination);nextNote=audio.currentTime+.08}if(audio.state==='suspended')audio.resume().catch(()=>{});}catch(e){soundOn=false;document.getElementById('sound').textContent='🔇 Sound unavailable'}}
function tone(freq,duration=.12,volume=.08,type='sine',when=null,endFreq=null){if(!soundOn||!audio||audio.state!=='running')return;const at=Math.max(audio.currentTime,when??audio.currentTime);const osc=audio.createOscillator(),gain=audio.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,at);if(endFreq)osc.frequency.exponentialRampToValueAtTime(Math.max(40,endFreq),at+duration);gain.gain.setValueAtTime(.0001,at);gain.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),at+.012);gain.gain.exponentialRampToValueAtTime(.0001,at+duration);osc.connect(gain);gain.connect(master);osc.start(at);osc.stop(at+duration+.025)}
function sound(kind){if(kind==='ring')tone(900,.13,.045,'sine',null,1350);if(kind==='mushroom'){tone(440,.15,.12,'triangle');tone(660,.17,.1,'triangle',audio?.currentTime+.1);tone(880,.22,.09,'sine',audio?.currentTime+.22)}if(kind==='heart'){[523,659,784,1047,1319].forEach((n,i)=>tone(n,.36,.12,'sine',audio?.currentTime+i*.11));tone(523,.85,.07,'triangle',audio?.currentTime+.55)}if(kind==='armor'){[392,523,659,784].forEach((n,i)=>tone(n,.25,.075,'triangle',audio?.currentTime+i*.085))}if(kind==='crash'){tone(190,.27,.16,'sawtooth',null,65);tone(95,.32,.09,'triangle',null,50)}}
const melody=[392,494,587,494,440,523,659,523,392,494,587,784,659,523,494,440],bass=[196,220,174.61,196];
function musicTick(){if(!running||!soundOn||!audio||audio.state!=='running')return;while(nextNote<audio.currentTime+.18){const i=musicStep++;tone(melody[i%melody.length],.35,.022,'sine',nextNote);if(i%4===0)tone(bass[Math.floor(i/4)%4],.75,.019,'triangle',nextNote);nextNote+=.34}}
document.getElementById('sound').addEventListener('click',()=>{soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'🔊 Sound':'🔇 Muted';document.getElementById('sound').setAttribute('aria-pressed',String(soundOn));if(soundOn){initAudio();if(audio)nextNote=audio.currentTime+.08}});
// Each adventurer celebrates differently when catching an extra life.
let celebrationTime=0,celebrationKind='';
function characterCelebrate(){celebrationTime=.85;celebrationKind=selected}
function animateCelebration(dt,t){if(celebrationTime<=0)return;celebrationTime=Math.max(0,celebrationTime-dt);const elapsed=.85-celebrationTime;
 if(celebrationKind==='rosie'){// Rosie does two delighted puppy hops and wags her tail.
   runner.position.y+=Math.max(0,Math.sin(elapsed*10))*0.22;
   runner.rotation.z=Math.sin(elapsed*16)*.12;
   if(parts.length){const tail=parts[parts.length-1];tail.rotation.y=Math.sin(elapsed*24)*.8;tail.rotation.z=Math.sin(elapsed*19)*.3}
 }else if(celebrationKind==='joshua'){// Joshua punches both hands into the air.
   for(let i=0;i<2&&i<parts.length;i++)parts[i].rotation.z=(i===0?1:-1)*Math.sin(Math.min(1,elapsed*5)*Math.PI/2)*1.1;
   runner.position.y+=Math.max(0,Math.sin(elapsed*5))*.12;
 }else if(celebrationKind==='sophia'){// Sophia performs a joyful twirl.
   runner.rotation.y=elapsed*4;
   runner.position.y+=Math.max(0,Math.sin(elapsed*6))*.1;
 }else if(celebrationKind==='jayden'){// Jayden celebrates with a bouncing happy dance.
   runner.rotation.z=Math.sin(elapsed*13)*.2;
   runner.position.y+=Math.max(0,Math.sin(elapsed*12))*.12;
   parts.forEach((p,i)=>{p.rotation.x=Math.sin(elapsed*15+i*Math.PI)*.8});
 }
 if(celebrationTime===0){runner.rotation.y=0;runner.rotation.z=0;parts.forEach(p=>{p.rotation.y=0;p.rotation.z=0})}
}
const particles=[];
function burst(x,y,z,color,count=12,power=1){for(let i=0;i<count;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.065+Math.random()*.07,6,5),new THREE.MeshBasicMaterial({color,transparent:true,opacity:1,depthWrite:false}));m.position.set(x,y,z);scene.add(m);particles.push({mesh:m,life:.55+Math.random()*.35,total:.9,vx:(Math.random()-.5)*5*power,vy:(Math.random()*3+1)*power,vz:(Math.random()-.5)*3*power})}}
function animateParticles(dt){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.mesh.position.x+=p.vx*dt;p.mesh.position.y+=p.vy*dt;p.mesh.position.z+=p.vz*dt;p.vy-=5*dt;p.mesh.material.opacity=Math.max(0,p.life/p.total);p.mesh.scale.setScalar(Math.max(.05,p.life/p.total));if(p.life<=0){scene.remove(p.mesh);p.mesh.geometry.dispose();p.mesh.material.dispose();particles.splice(i,1)}}}
function celebrateHeart(){const el=document.getElementById('celebrate');el.innerHTML='<span>❤️ +1 life</span>';const child=el.firstElementChild;child.addEventListener('animationend',()=>{if(el.firstElementChild===child)el.replaceChildren()},{once:true})}

const eye=mat(0x242b2a),hair=mat(0x76533b),blonde=mat(0xd6b16d),pink=mat(0xf1d7e2),cream=mat(0xf4e8d5),khaki=mat(0xb7a47d),fur=mat(0xd6a157),nose=mat(0x393333),navy=mat(0x274e42);
let selected='joshua',parts=[];
const characterNames={joshua:'Joshua',sophia:'Sophia',jayden:'Jayden',rosie:'Rosie'};
const highScoreKey='little-adventure-highscores-v1';
let highScores={joshua:0,sophia:0,jayden:0,rosie:0};
try{const saved=JSON.parse(localStorage.getItem(highScoreKey)||'{}');for(const id of Object.keys(highScores)){const n=Number(saved[id]);if(Number.isFinite(n)&&n>=0)highScores[id]=Math.floor(n)}}catch(e){}
function saveBest(){const n=Math.floor(score);if(n>highScores[selected]){highScores[selected]=n;try{localStorage.setItem(highScoreKey,JSON.stringify(highScores))}catch(e){} }showBest()}
function showBest(){document.getElementById('best').textContent=characterNames[selected]+' best: '+highScores[selected]}
function leaderboard(){return '<div style="background:#f1f8ef;border-radius:14px;padding:10px;margin:12px 0;text-align:left"><strong>🏆 Character high scores</strong>'+Object.keys(highScores).map(id=>'<div style="display:flex;justify-content:space-between;margin-top:5px"><span>'+characterNames[id]+'</span><strong>'+highScores[id]+'</strong></div>').join('')+'</div>'}

const hat={rotation:{y:0}};
function limb(x,y,z,m){const p=new THREE.Group();p.position.set(x,y,z);runner.add(p);box(.23,.55,.25,m,0,-.275,0,p);parts.push(p)}
function buildCharacter(id){
celebrationTime=0;selected=id;showBest();while(runner.children.length){const o=runner.children[0];runner.remove(o);o.traverse(n=>{if(n.geometry)n.geometry.dispose()})}parts=[];runner.position.set(0,0,0);runner.rotation.set(0,0,0);
if(id==='rosie'){
box(.72,.65,1.25,fur,0,.85,0,runner);ball(.43,fur,0,1.16,-.58,runner);
for(const x of [-.4,.4]){const ear=ball(.18,blonde,x,1.06,-.62,runner);ear.scale.y=1.5}
ball(.15,nose,0,1.08,-.97,runner);
for(const x of [-.18,.18])ball(.07,eye,x,1.3,-.93,runner);
for(const x of [-.28,.28])for(const z of [-.43,.43])limb(x,.67,z,fur);
const tail=new THREE.Group();tail.position.set(0,1,.7);runner.add(tail);ball(.17,fur,0,.22,.2,tail);parts.push(tail);
}else{
const shirt=id==='joshua'?navy:id==='sophia'?pink:cream;
const pants=id==='joshua'?blue:id==='sophia'?pink:khaki;
const hairmat=id==='sophia'?blonde:hair;
box(.73,.8,.43,shirt,0,1.02,0,runner);ball(.42,skin,0,1.7,0,runner);
const cap=ball(.44,hairmat,0,1.94,0,runner);cap.scale.y=.43;
for(const x of [-.37,.37]){const side=ball(.16,hairmat,x,1.65,0,runner);side.scale.y=id==='sophia'?2.5:id==='jayden'?2:1.3}
for(const x of [-.16,.16])ball(.075,eye,x,1.73,-.38,runner);
for(const x of [-.43,.43])limb(x,1.35,0,shirt);
for(const x of [-.22,.22])limb(x,.68,0,pants);
}}
buildCharacter('joshua');
const lanes=[-2.5,0,2.5];const decorations=[];const coins=[];const clock=new THREE.Clock();function tree(x,z){const scale=.48+Math.random()*1.45;const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(scale);scene.add(g);mesh(new THREE.CylinderGeometry(.48,.68,6.5,9),brown,0,3.25,0,g);mesh(new THREE.ConeGeometry(3.3,7.5,9),dark,0,9,0,g);mesh(new THREE.ConeGeometry(2.7,6,9),green,0,12,0,g);decorations.push(g)}function rock(x,z,obstacle=false){const o=mesh(new THREE.DodecahedronGeometry(obstacle?.85:.55,0),stone,x,obstacle?.65:.42,z);o.rotation.set(.1,.4,.2);decorations.push(o);if(obstacle)obstacles.push(o)}
let obstacles=[];const hazards=[];const branchMat=mat(0x80502c);
function branch(z){const group=new THREE.Group();group.position.z=z;scene.add(group);box(10,.42,.48,branchMat,0,.44,0,group);for(const x of [-4,-2,1.5,3.6]){const twig=box(.15,.65,.15,branchMat,x,.85,0,group);twig.rotation.z=x*.08}decorations.push(group);hazards.push({object:group,type:'branch',width:.55})}
for(let z=-30;z>-82;z-=22){branch(z)}
for(let z=-70;z<12;z+=6){tree(-5-Math.random()*6,z+Math.random()*3);tree(5+Math.random()*6,z+Math.random()*3);if(Math.random()<.5)rock((Math.random()>.5?1:-1)*(4+Math.random()*3),z)}
for(let z=-12;z>-80;z-=9){const c=mesh(new THREE.TorusGeometry(.4,.13,8,16),yellow,lanes[Math.floor(Math.random()*3)],1.3,z);coins.push(c);decorations.push(c)}
for(let z=-18;z>-70;z-=12)rock([-2.5,0,2.5][Math.floor(Math.random()*3)],z,true);
for(let z=-75;z<15;z+=3){for(const side of [-1,1]){const x=side*(3.8+Math.random()*8);const stem=mesh(new THREE.CylinderGeometry(.025,.025,.4,5),dark,x,.2,z+Math.random()*2);const flower=ball(.16,[yellow,skin,blue][Math.floor(Math.random()*3)],x,.47,stem.position.z);decorations.push(stem,flower)}}

// Canyon walls: occasional tall clusters of angular boulders outside the running lanes.
const canyon=mat(0x9c8671),canyonShade=mat(0x786e66);
for(let z=-72;z<8;z+=38){for(const side of [-1,1]){const group=new THREE.Group();group.position.set(side*9,0,z);scene.add(group);for(let i=0;i<5;i++){const height=3+Math.random()*5;const cliff=mesh(new THREE.DodecahedronGeometry(2.3+Math.random(),0),i%2?canyon:canyonShade,side*(i%2)*1.2,height*.38,-5+i*2.4,group);cliff.scale.set(1.3,height/4,1.2)}decorations.push(group)}}
const armors=[];
const armorGold=mat(0xe8bb51),armorBlue=mat(0x5ca6ce);
function makeArmor(z){const g=new THREE.Group();g.position.set(lanes[Math.floor(Math.random()*3)],1.35,z);scene.add(g);
 const shieldShape=new THREE.Shape();shieldShape.moveTo(-.43,.42);shieldShape.lineTo(.43,.42);shieldShape.lineTo(.39,-.16);shieldShape.quadraticCurveTo(.25,-.48,0,-.62);shieldShape.quadraticCurveTo(-.25,-.48,-.39,-.16);shieldShape.closePath();
 const shield=mesh(new THREE.ShapeGeometry(shieldShape),armorBlue,0,0,0,g);shield.material.side=THREE.DoubleSide;
 const crest=mesh(new THREE.OctahedronGeometry(.22),armorGold,0,.05,.08,g);crest.scale.z=.25;
 for(const x of [-.37,.37])box(.09,.58,.12,armorGold,x,.1,.04,g);
 decorations.push(g);armors.push(g);
}
for(let z=-48;z>-85;z-=34)makeArmor(z);
const mushrooms=[],hearts=[];const red=mat(0xe83d3b),white=mat(0xffffff),stemMat=mat(0xf5e8c9);
function mushroom(z){const g=new THREE.Group();g.position.set(lanes[Math.floor(Math.random()*3)],0,z);scene.add(g);mesh(new THREE.CylinderGeometry(.13,.18,.5,8),stemMat,0,.95,0,g);const cap=mesh(new THREE.SphereGeometry(.38,12,8),red,0,1.28,0,g);cap.scale.y=.5;for(const [x,d] of [[-.17,-.06],[.16,.05],[0,.17]])ball(.065,white,x,1.47,d,g);decorations.push(g);mushrooms.push(g)}
for(let z=-20;z>-80;z-=17)mushroom(z);
function makeHeart(){const g=new THREE.Group();g.position.set(0,1.4,-85);scene.add(g);const shape=new THREE.Shape();shape.moveTo(0,-.35);shape.bezierCurveTo(-.75,.15,-.45,.65,0,.28);shape.bezierCurveTo(.45,.65,.75,.15,0,-.35);const heart=mesh(new THREE.ShapeGeometry(shape),red,0,0,0,g);heart.material.side=THREE.DoubleSide;decorations.push(g);hearts.push(g)}
makeHeart();
let lives=3,nextHeartAt=500,heartPending=false,invulnerable=0,heartShield=0,armorShield=0;
function updateHud(){document.getElementById('score').textContent=Math.floor(score);document.getElementById('lives').textContent=lives;document.getElementById('shield').textContent=armorShield>0?'🛡️ Armor '+Math.ceil(armorShield)+'s':heartShield>0?'❤️ Shield '+Math.ceil(heartShield)+'s':''}
function hit(){if(invulnerable>0||armorShield>0)return;sound("crash");burst(runner.position.x,1,0,0xffbd72,18,1.2);lives--;invulnerable=1.7;updateHud();if(lives<=0)end()}

let running=false,score=0,coinsCaught=0,speed=12,vy=0,lane=1,last=performance.now();const overlay=document.getElementById('overlay'),panel=document.getElementById('panel');
function reset(){celebrationTime=0;runner.rotation.y=0;initAudio();if(audio)nextNote=audio.currentTime+.1;musicStep=0;document.getElementById("celebrate").replaceChildren();saveBest();lives=3;nextHeartAt=500;heartPending=false;invulnerable=0;heartShield=0;armorShield=0;for(const a of armors){a.visible=true;a.position.z=-48-armors.indexOf(a)*34;a.position.x=lanes[Math.floor(Math.random()*3)]}hearts[0].visible=false;hearts[0].position.z=-85;for(const m of mushrooms)m.visible=true;score=0;coinsCaught=0;speed=12;vy=0;lane=1;runner.position.set(0,0,0);for(const c of coins){c.visible=true}for(const h of hazards){h.object.position.z=-30-hazards.indexOf(h)*22}for(let i=0;i<obstacles.length;i++){obstacles[i].position.z=-18-i*12;obstacles[i].position.x=lanes[Math.floor(Math.random()*3)]}updateHud();running=true;overlay.style.display='none';document.getElementById('change').hidden=false;last=performance.now()}
function end(){running=false;saveBest();panel.innerHTML='<h1>🌟 Great run!</h1><p>You scored <strong>'+Math.floor(score)+'</strong> points!</p>'+leaderboard()+'<button id="again">Play again</button>';overlay.style.display='grid';document.getElementById('again').addEventListener('click',reset)}
function jump(){if(running&&runner.position.y<.02){vy=9.5}}function move(d){if(running)lane=Math.max(0,Math.min(2,lane+d))}
const chooser=panel.innerHTML;
function wireChooser(){panel.querySelectorAll('[data-id]').forEach(b=>b.addEventListener('click',()=>{buildCharacter(b.dataset.id);panel.querySelectorAll('[data-id]').forEach(c=>c.classList.toggle('selected',c===b))}));panel.querySelector('#start').addEventListener('click',reset)}
panel.insertAdjacentHTML('beforeend',leaderboard());wireChooser();
document.getElementById('change').addEventListener('click',()=>{running=false;overlay.style.display='grid';panel.innerHTML=chooser+leaderboard();document.getElementById('change').hidden=true;wireChooser();panel.querySelector('[data-id="'+selected+'"]').click()});
window.littleAdventureReady=true;document.getElementById('jump').addEventListener('click',jump);document.getElementById('left').addEventListener('click',()=>move(-1));document.getElementById('right').addEventListener('click',()=>move(1));renderer.domElement.addEventListener('pointerdown',jump);
window.addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='Space'||e.code==='ArrowUp')jump();if(e.code==='ArrowLeft')move(-1);if(e.code==='ArrowRight')move(1)});
let sx=0;renderer.domElement.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});renderer.domElement.addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>35)move(d>0?1:-1)},{passive:true});
function tick(t){requestAnimationFrame(tick);const dt=Math.min((t-last)/1000,.05);last=t;animateParticles(dt);musicTick();if(running){score+=dt*8;if(Math.floor(score)>highScores[selected])saveBest();invulnerable=Math.max(0,invulnerable-dt);heartShield=Math.max(0,heartShield-dt);armorShield=Math.max(0,armorShield-dt);runner.visible=heartShield>0||armorShield>0||invulnerable===0||Math.floor(t/120)%2===0;if(score>=nextHeartAt){heartPending=true;nextHeartAt+=500}if(heartPending&&!hearts[0].visible){hearts[0].visible=true;hearts[0].position.z=-72;hearts[0].position.x=lanes[Math.floor(Math.random()*3)];heartPending=false}speed=Math.min(23,12+score/100);updateHud();runner.position.x+=(lanes[lane]-runner.position.x)*Math.min(1,dt*12);vy-=24*dt;runner.position.y=Math.max(0,runner.position.y+vy*dt);if(runner.position.y===0)vy=0;runner.rotation.z=Math.sin(t*.014)*.035;runner.rotation.x=runner.position.y>0?-.13:Math.sin(t*.018)*.055;parts.forEach((p,i)=>{p.rotation.x=Math.sin(t*.014+(i%2)*Math.PI)*(runner.position.y>.1?.1:.38)});animateCelebration(dt,t);camera.position.x+=(runner.position.x*.28-camera.position.x)*Math.min(1,dt*2);camera.position.y+=(5+runner.position.y*.13-camera.position.y)*Math.min(1,dt*2);camera.lookAt(runner.position.x*.32,1.1,-9);for(const o of decorations){o.position.z+=speed*dt;if(o.position.z>15){o.position.z-=85;if(obstacles.includes(o))o.position.x=lanes[Math.floor(Math.random()*3)];if(armors.includes(o)){o.position.x=lanes[Math.floor(Math.random()*3)];o.visible=true}if(mushrooms.includes(o)){o.position.x=lanes[Math.floor(Math.random()*3)];o.visible=true}if(hearts.includes(o)){o.visible=false}if(coins.includes(o)){o.position.x=lanes[Math.floor(Math.random()*3)];o.visible=true}}}for(const c of coins){c.rotation.y+=dt*4;if(c.visible&&Math.abs(c.position.z)<.8&&Math.abs(c.position.x-runner.position.x)<.8&&Math.abs(c.position.y-(runner.position.y+1.2))<1.3){c.visible=false;burst(c.position.x,c.position.y,c.position.z,0xffdc55,10,.65);sound("ring");coinsCaught++;score+=25;updateHud()}}
for(const m of mushrooms){if(m.visible&&Math.abs(m.position.z)<.8&&Math.abs(m.position.x-runner.position.x)<.85){m.visible=false;burst(m.position.x,1.3,m.position.z,0xff5555,24,1.1);burst(m.position.x,1.3,m.position.z,0xffffff,12,.8);sound("mushroom");score+=75;updateHud()}}
for(const a of armors){a.rotation.y+=dt*1.6;a.position.y=1.35+Math.sin(t*.003+a.position.z)*.13;if(a.visible&&Math.abs(a.position.z)<.95&&Math.abs(a.position.x-runner.position.x)<.85){a.visible=false;armorShield=15;burst(a.position.x,1.35,a.position.z,0x73d7ff,20,.8);burst(a.position.x,1.35,a.position.z,0xffd477,10,.65);sound("armor");updateHud()}}
for(const h of hearts){if(h.visible&&Math.abs(h.position.z)<.9&&Math.abs(h.position.x-runner.position.x)<.85){h.visible=false;burst(h.position.x,1.4,h.position.z,0xff366d,15,.7);burst(h.position.x,1.4,h.position.z,0xffe87a,9,.6);celebrateHeart();characterCelebrate();sound("heart");invulnerable=Math.max(invulnerable,6);heartShield=6;lives++;updateHud()}}
for(const h of hazards){if(Math.abs(h.object.position.z)<h.width/2+.25&&runner.position.y<1.05)hit()}
for(const o of obstacles){if(Math.abs(o.position.z)<.85&&Math.abs(o.position.x-runner.position.x)<.85&&runner.position.y<1.1)hit()}}renderer.render(scene,camera)}
requestAnimationFrame(tick);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
