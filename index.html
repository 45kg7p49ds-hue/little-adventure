<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Little Adventure</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#b5e8ff;overflow:hidden;touch-action:manipulation}#game{position:fixed;inset:0}canvas{display:block}#hud{position:fixed;top:16px;left:16px;color:#173e30;background:#ffffffdb;border-radius:18px;padding:12px 18px;font-weight:800;font-size:20px}#hint{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#ffffffdc;padding:10px 18px;border-radius:18px;text-align:center;font-size:14px;color:#244332;white-space:nowrap}#overlay{position:fixed;inset:0;display:grid;place-items:center;background:#143d3970}#panel{background:white;padding:28px;border-radius:26px;text-align:center;max-width:320px;width:85%;box-shadow:0 20px 60px #0003}h1{margin:0 0 10px;font-size:30px;color:#246342}p{line-height:1.5;color:#51645a}button{border:0;background:#ffbf4a;color:#473214;border-radius:16px;padding:15px 35px;font-weight:900;font-size:19px;cursor:pointer}#mobile{position:fixed;bottom:80px;left:0;right:0;display:flex;justify-content:space-between;padding:0 22px;pointer-events:none}#mobile button{pointer-events:auto;background:#ffffffb8;padding:13px 18px;font-size:24px;touch-action:manipulation}@media(pointer:fine){#mobile{display:none}}
</style></head><body><div id="game"></div><div id="hud">⭐ <span id="score">0</span></div><div id="hint">SPACE / TAP to jump · ← → to dodge</div><div id="mobile"><button id="left" aria-label="Move left">◀</button><button id="jump" aria-label="Jump">⬆</button><button id="right" aria-label="Move right">▶</button></div><div id="overlay"><div id="panel"><h1>🌳 Little Adventure</h1><p>Run through the forest! Jump over boulders and dodge the obstacles.</p><button id="start">Let's play!</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/+esm';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xaee6ff);scene.fog=new THREE.Fog(0xaee6ff,22,75);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,150);camera.position.set(0,5,10);camera.lookAt(0,1,-9);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.getElementById('game').append(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x75965b,2.2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(-8,16,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.9});const green=mat(0x7acb71),dark=mat(0x39884c),brown=mat(0x996342),stone=mat(0x858e99),yellow=mat(0xffd05b),blue=mat(0x488ee6),skin=mat(0xffc58f);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),green);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
function mesh(geo,m,x,y,z,parent=scene){const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o}
const box=(w,h,d,m,x,y,z,p)=>mesh(new THREE.BoxGeometry(w,h,d),m,x,y,z,p);
const ball=(r,m,x,y,z,p)=>mesh(new THREE.SphereGeometry(r,12,9),m,x,y,z,p);
const runner=new THREE.Group();scene.add(runner);ball(.48,skin,0,1.65,0,runner);box(.7,.8,.42,blue,0,.95,0,runner);box(.24,.5,.3,brown,-.22,.32,0,runner);box(.24,.5,.3,brown,.22,.32,0,runner);ball(.09,dark,-.17,1.7,.43,runner);ball(.09,dark,.17,1.7,.43,runner);const hat=mesh(new THREE.ConeGeometry(.5,.35,12),yellow,0,2.18,0,runner);
const decorations=[];function tree(x,z){const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);mesh(new THREE.CylinderGeometry(.17,.25,1.5,8),brown,0,.75,0,g);mesh(new THREE.ConeGeometry(1.05,2.5,7),dark,0,2.3,0,g);decorations.push(g)}function rock(x,z,obstacle=false){const o=mesh(new THREE.DodecahedronGeometry(obstacle?.85:.55,0),stone,x,obstacle?.65:.42,z);o.rotation.set(.1,.4,.2);decorations.push(o);if(obstacle)obstacles.push(o)}
let obstacles=[];for(let z=-70;z<12;z+=6){tree(-5-Math.random()*6,z+Math.random()*3);tree(5+Math.random()*6,z+Math.random()*3);if(Math.random()<.5)rock((Math.random()>.5?1:-1)*(4+Math.random()*3),z)}
for(let z=-18;z>-70;z-=12)rock([-2.5,0,2.5][Math.floor(Math.random()*3)],z,true);
let running=false,score=0,speed=12,vy=0,lane=1,last=performance.now();const lanes=[-2.5,0,2.5];const overlay=document.getElementById('overlay'),panel=document.getElementById('panel');
function reset(){score=0;speed=12;vy=0;lane=1;runner.position.set(0,0,0);for(let i=0;i<obstacles.length;i++){obstacles[i].position.z=-18-i*12;obstacles[i].position.x=lanes[Math.floor(Math.random()*3)]}running=true;overlay.style.display='none';last=performance.now()}
function end(){running=false;panel.innerHTML='<h1>🌟 Great run!</h1><p>You scored <strong>'+Math.floor(score)+'</strong> points!</p><button id="again">Play again</button>';overlay.style.display='grid';document.getElementById('again').addEventListener('click',reset)}
function jump(){if(running&&runner.position.y<.02){vy=9.5}}function move(d){if(running)lane=Math.max(0,Math.min(2,lane+d))}
document.getElementById('start').addEventListener('click',reset);document.getElementById('jump').addEventListener('click',jump);document.getElementById('left').addEventListener('click',()=>move(-1));document.getElementById('right').addEventListener('click',()=>move(1));renderer.domElement.addEventListener('pointerdown',jump);
window.addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='Space'||e.code==='ArrowUp')jump();if(e.code==='ArrowLeft')move(-1);if(e.code==='ArrowRight')move(1)});
let sx=0;renderer.domElement.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});renderer.domElement.addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>35)move(d>0?1:-1)},{passive:true});
function tick(t){requestAnimationFrame(tick);const dt=Math.min((t-last)/1000,.05);last=t;if(running){score+=dt*8;speed=Math.min(23,12+score/100);document.getElementById('score').textContent=Math.floor(score);runner.position.x+=(lanes[lane]-runner.position.x)*Math.min(1,dt*12);vy-=24*dt;runner.position.y=Math.max(0,runner.position.y+vy*dt);if(runner.position.y===0)vy=0;runner.rotation.z=Math.sin(t*.014)*.035;for(const o of decorations){o.position.z+=speed*dt;if(o.position.z>15){o.position.z-=85;if(obstacles.includes(o))o.position.x=lanes[Math.floor(Math.random()*3)]}}for(const o of obstacles){if(Math.abs(o.position.z)<.85&&Math.abs(o.position.x-runner.position.x)<.85&&runner.position.y<1.1){end();break}}}renderer.render(scene,camera)}
requestAnimationFrame(tick);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
